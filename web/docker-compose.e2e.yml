# web/docker-compose.e2e.yml — Plan 3-owned convergence harness (contracts §1).
# Build contexts cross into sibling subtrees: ../api, ../worker.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: artweb
      POSTGRES_USER: art
      POSTGRES_PASSWORD: art
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U art"]
      interval: 1s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --address :9000 --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/ready || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set m http://minio:9000 minioadmin minioadmin &&
      mc mb -p m/art-dev || true
      "

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    env_file:
      - path: ../api/.env.dev
        required: false
    environment:
      ADDR: ":8080"
      APP_ENV: test
      DATABASE_URL: postgres://art:art@postgres:5432/artweb?sslmode=disable
      JWT_SIGNING_KEY: "3031323334353637383961626364656630313233343536373839616263646566"
      WORKER_SIGNING_KEY: "3031323334353637383961626364656630313233343536373839616263646566"
      CDN_ORIGIN: "http://localhost:8787"
      FRONTEND_URL: "http://localhost:3000/"
      S3_ENDPOINT: "http://minio:9000"
      R2_ACCESS_KEY_ID: "minioadmin"
      R2_ACCESS_KEY_SECRET: "minioadmin"
      R2_BUCKET: "art-dev"
    depends_on:
      postgres:    { condition: service_healthy }
      minio:       { condition: service_healthy }
      minio-init:  { condition: service_completed_successfully }
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  worker:
    build:
      context: ../worker
      dockerfile: Dockerfile.e2e
    environment:
      PORT: "8787"
      WORKER_SIGNING_KEY: "3031323334353637383961626364656630313233343536373839616263646566"
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY_ID: "minioadmin"
      S3_SECRET_ACCESS_KEY: "minioadmin"
      R2_BUCKET: "art-dev"
    depends_on:
      minio: { condition: service_healthy }
    ports: ["8787:8787"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8787/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE: "http://localhost:8080"
      NEXT_PUBLIC_CDN_BASE: "http://localhost:8787"
      API_BASE_INTERNAL: "http://api:8080"
    depends_on:
      api:    { condition: service_healthy }
      worker: { condition: service_healthy }
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || wget -qO- http://localhost:3000/ || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
