# .github/workflows/e2e.yml
name: e2e

on:
  push:
    paths: [ 'api/**', 'worker/**', 'web/**', 'web/docker-compose.e2e.yml', '.github/workflows/e2e.yml' ]
  pull_request:
    paths: [ 'api/**', 'worker/**', 'web/**', 'web/docker-compose.e2e.yml', '.github/workflows/e2e.yml' ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - name: Generate ephemeral signing keys + fake OAuth creds for the e2e stack
        # web/docker-compose.e2e.yml requires web/.env.local with hex-encoded
        # 32-byte signing keys; api/.env.dev (optional) carries Google OAuth
        # creds locally. Both files are gitignored (per-developer secrets), so
        # CI synthesises throwaway values per run.
        #
        # The Playwright login_flow spec mocks accounts.google.com and only
        # checks that GOOGLE_OAUTH_CLIENT_ID surfaces as a non-empty string in
        # the authorize URL — any placeholder works. The signing keys gate
        # the api against the ephemeral Postgres + MinIO that get torn down
        # at job end.
        run: |
          {
            echo "JWT_SIGNING_KEY=$(openssl rand -hex 32)"
            echo "WORKER_SIGNING_KEY=$(openssl rand -hex 32)"
            echo "GOOGLE_OAUTH_CLIENT_ID=fake-ci-client-id"
            echo "GOOGLE_OAUTH_CLIENT_SECRET=fake-ci-client-secret"
          } > web/.env.local
      - name: Build + start full stack
        run: docker compose -f web/docker-compose.e2e.yml up -d --build --wait
      - name: Install Playwright deps
        working-directory: web
        run: bun install --frozen-lockfile && bunx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: web
        env:
          API_BASE: http://localhost:8080
          CDN_BASE: http://localhost:8787
          WEB_BASE: http://localhost:3000
        run: bun run test:e2e
      - name: Tear down
        if: always()
        run: docker compose -f web/docker-compose.e2e.yml down -v
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: web/playwright-report/ }
