name: api

on:
  push:
    paths: [ 'api/**', '.github/workflows/api.yml' ]
  pull_request:
    paths: [ 'api/**', '.github/workflows/api.yml' ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: api/go.sum
      - run: go mod download
      - run: go vet ./...
      - run: go test -race ./...
